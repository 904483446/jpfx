[project]
name = "jpfx-api"
version = "0.1.0"
description = "FastAPI backend for AI Competitor Intelligence Workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.41,<2.1.0",
    "alembic>=1.16.0,<2.0.0",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx2>=2.0.0,<3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
