[project]
name = "jpfx-api"
version = "0.1.0"
description = "FastAPI backend for AI Competitor Intelligence Workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.41,<2.1.0",
    "alembic>=1.16.0,<2.0.0",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pwdlib[argon2]>=0.3.0,<1.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pgvector>=0.4.0,<1.0.0",
    "cryptography>=45.0.0,<46.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
