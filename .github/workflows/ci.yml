name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jpfx_test
          POSTGRES_USER: jpfx
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jpfx -d jpfx_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: services/api
    env:
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
      AUTH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000
      TEST_DATABASE_URL: postgresql+psycopg://jpfx:ci-only-password@127.0.0.1:5432/jpfx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check --no-cache .
      - run: python -m ruff format --check --no-cache .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:routes
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
